name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executables
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build installer and portable executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dist -- --publish onTag

      - name: Verify release executables
        shell: pwsh
        run: |
          $executables = Get-ChildItem -LiteralPath release -Filter '*.exe' -File
          if ($executables.Count -lt 2) { throw 'Expected both the installer and portable .exe files in release.' }
          $executables | Select-Object Name, Length

      - name: Upload Windows executables to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Lovense-Remote-Reply-Assistant-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
